apiVersion: v1
kind: ConfigMap
metadata:
  name: hotdeal-bot-config
data:
  # Discord 봇 설정
  COMMAND_PREFIX: "!"
  
  # 데이터베이스 설정 (호스트의 Docker PostgreSQL에 접근)
  # OrbStack/macOS에서는 host.docker.internal 사용
  DATABASE_URL: "postgresql://root:root@host.docker.internal:5432/studydb"
  
  # 크롤링 설정
  CRAWL_INTERVAL: "3600"

  # AI 분석 설정 (GEMINI_API_KEY는 Secret에서 주입)
  AI_ANALYSIS_DELAY_HOURS: "3"
  
  # 애플 리퍼비쉬 감시 (트리거 키워드 등록자에게만 알림, 등록자 없으면 크롤링 안 함)
  APPLE_REFURB_TRIGGER_KEYWORD: "애플리퍼"
  APPLE_REFURB_INTERVAL_MINUTES: "10"
  APPLE_REFURB_MODEL: "macbookpro"
  APPLE_REFURB_SCREEN: "14inch"
  APPLE_REFURB_MIN_MEMORY_GB: "64"
  APPLE_REFURB_MIN_STORAGE_GB: "1024"
  APPLE_REFURB_CHIPS: "M3,M4,M5"

  # 로깅 설정
  LOG_LEVEL: "INFO"
  LOG_FILE: "hotdeal_bot.log"
  
  # 타임존 설정
  TZ: "Asia/Seoul"
